# Public reference configuration.
#
# This file is intentionally not the exact final submission recipe. It keeps
# the architecture family readable while withholding private run details,
# exact leaderboard-tuned windows, and final checkpoint-selection settings.

job_name: public-reference
notes: "Redacted reference recipe for studying the model family."

args:
  seed: 1
  valid_split_strategy: time
  valid_ratio: 0.05
  num_epochs: 2
  batch_size: 128
  lr: 0.0001
  sparse_lr: 0.05
  action_num: 2
  multi_task_loss: true
  click_loss_weight: 1.0
  conversion_loss_weight: 1.0
  ns_tokenizer_type: rankmixer
  user_ns_tokens: 4
  item_ns_tokens: 2
  num_queries: 1
  seq_encoder_type: swiglu
  seq_max_lens: "seq_a:128,seq_b:128,seq_c:256,seq_d:256"
  enable_per_domain_buckets: true
  enable_amp: true
  amp_dtype: bfloat16
